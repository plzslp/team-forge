# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# https://docs.coderabbit.ai/reference/configuration
language: ko-KR
tone_instructions: >-
  문제점과 한계를 구체적으로 짚고, 영향과 근거를 명확히 설명하세요.
  필요한 대안은 장단점과 함께 제시하고 개선 방향과 학습에 도움이 되는 코멘트를 작성하세요.
  지나치게 딱딱하지 않게 논리적으로 설명하며 코드 식별자, 파일 경로와 API 이름은 원문을 유지하세요.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  high_level_summary_instructions: |
    아래 구조로 한국어 PR 요약을 작성하세요.
    구현 세부를 나열하기보다 변경이 필요한 이유, 선택한 방식,
    기존 코드 흐름과 동작에서 달라진 점을 설명하세요.
    PR 본문과 diff에서 확인되는 사실만 사용하고 추측하지 마세요.

    ## 🔗 관련 이슈
    - 명시적으로 연결된 이슈가 있으면 번호와 관계를 표시합니다.
    - 실제로 해결하는 이슈에만 closes #번호를 사용합니다.
    - 연결된 이슈가 없으면 '관련 이슈 없음'으로 작성합니다.

    ## 📝 작업 내용
    - 해결하려는 문제와 기존 구조의 한계를 요약합니다.

    ### 주요 변경사항
    1. 구조 또는 책임 관점의 주요 변화
    2. 데이터 흐름, 예외 처리, API 계약 등에서 달라진 점
    3. 리뷰 시 확인할 변경이나 트레이드오프
    - 해당하지 않거나 근거가 부족한 항목은 그 사실을 명시합니다.

    ### 📊 변경 효과 요약
    - 확인할 수 있는 파일·라인 변화와 테스트 추가 수만 포함합니다.
    - 테스트 코드 추가를 테스트 실행 성공으로 표현하지 마세요.
    - 성능 개선은 실제 측정 근거가 있을 때만 작성합니다.
    - 수치를 확인할 수 없거나 의미가 작으면
      '정량 지표는 이번 PR에서 측정하지 않음'으로 작성합니다.
  sequence_diagrams: false
  changed_files_summary: false
  suggested_labels: false
  suggested_reviewers: false
  poem: false
  abort_on_close: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "^dev$"
      - "^main$"
  tools:
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    sqlfluff:
      enabled: true
  path_filters:
    - "!build/**"
    - "!target/**"
    - "!.gradle/**"
    - "!frontend/node_modules/**"
    - "!frontend/dist/**"
    - "!**/*.class"
    - "!**/*.jar"

chat:
  auto_reply: true

code_generation:
  docstrings:
    language: ko-KR
    path_instructions:
      - path: "src/main/java/**"
        instructions: |
          - JavaDoc 형식으로 한국어 설명을 작성하세요.
          - 메서드 목적과 필요한 파라미터, 반환값, 예외 정보를 설명하세요.
          - 공개 API는 계약 중심으로, 내부 메서드는 핵심 의도 중심으로 작성하세요.
          - 코드만 읽어도 명확한 동작을 반복 설명하는 주석은 피하세요.
  unit_tests:
    path_instructions:
      - path: "src/main/java/**"
        instructions: |
          - 기존 테스트 구성과 docs/BACKEND_STRUCTURE.md의 검증 규칙을 따르세요.
          - Controller는 검증 범위에 따라 MockMvc 슬라이스 테스트 또는
            기존 SpringBootTest + MockMvc + H2 통합 테스트를 사용하세요.
          - Service와 도메인 로직은 외부 의존성 필요 여부에 따라 단위 테스트를 작성하세요.
          - Given-When-Then 주석으로 준비, 실행, 검증을 구분하세요.
          - 성공과 실패 케이스에서 관찰 가능한 동작과 데이터 보존을 검증하세요.
          - 테스트 추가를 이유로 새 라이브러리나 Testcontainers를 강제하지 마세요.

# 백엔드 규칙은 현재 구현과 함께 관리하는 구조 문서를 기준으로 한다.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "docs/BACKEND_STRUCTURE.md"
        applyTo: "src/main/java/**"
