spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:h2:mem:teamforge;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
